  async load() {
    try {
      const headers = APP_KEY ? {"X-App-Key": APP_KEY} : {};
      const r = await fetch(`${SERVER}/data`, {headers});
      if (!r.ok) throw new Error("server error");
      return await r.json();
    } catch(e) {
      console.warn("Load failed:", e);
      return null;
    }
  },
  async save(data) {
    try {
      const headers = {"Content-Type": "application/json"};
      if (APP_KEY) headers["X-App-Key"] = APP_KEY;
      const r = await fetch(`${SERVER}/data`, {
        method: "POST",
        headers,
        body: JSON.stringify(data),

      console.warn("Save failed:", e);

// ── HELPERS ───────────────────────────────────────────────────────────────────
function fmtTime(secs){const m=Math.floor(secs/60),s=secs%60;return`${m}:${String(s).padStart(2,"0")}`;}
function parseTime(str){if(!str)return null;const p=str.split(":");if(p.length<2)return null;const[m,s]=p.map(Number);return isNaN(m)||isNaN(s)?null:m*60+s;}
function pct(val,metric){
  if(!metric.higherIsBetter){const r=metric.baseline-metric.comp;return Math.min(100,Math.max(0,Math.round(((metric.baseline-val)/r)*100)));}
  const r=metric.comp-metric.baseline;return Math.min(100,Math.max(0,Math.round(((val-metric.baseline)/r)*100)));
}
function calcTarget(actual,lastTarget,prescribed,ceiling,higherIsBetter){
  if(actual==null) return prescribed;
  // Only compound from actual — never from a target the user didn't reach
  // If they hit or exceeded the target, use target as base (rewards consistency)
  // If they fell short, use actual as base (no penalty compounding)
  const metTarget = higherIsBetter ? actual >= lastTarget : actual <= lastTarget;
  const base = metTarget ? lastTarget : actual;
  const next = higherIsBetter ? Math.round(base * 1.10) : Math.round(base * 0.91);
  if(higherIsBetter) return Math.min(next, ceiling ?? 9999);
  return Math.max(next, ceiling ?? 0);
}

// Resolves {fieldKey} placeholders in exercise detail strings using current progression targets
function resolveDetail(detailStr, wkId, getTargetFn) {
  if(!detailStr || !detailStr.includes("{")) return detailStr;
  return detailStr.replace(/\{(\w+)\}/g, (_, key) => {
    const schema = getSchema(wkId);
    const field = schema.find(f => f.key === key);
    const val = getTargetFn(wkId, key);
    if(val == null) return field?.prescribedTarget ?? "—";
    if(field?.type === "time") return fmtTime(val);
    return String(val);
  });
}
